# Firebase App Hosting configuration. Committed; contains no secrets.
#
# Note on availability: every NEXT_PUBLIC_* variable below must include BUILD,
# because Next.js inlines them into the client bundle at build time. A
# RUNTIME-only value is simply `undefined` in the browser, which is the most
# common App Hosting + Next.js misconfiguration. RUNTIME is listed as well so
# server-side code can read the same values.

runConfig:
  cpu: 1
  memoryMiB: 512
  concurrency: 80
  minInstances: 0
  maxInstances: 10

env:
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: "AIzaSyAOPJoCpNhzfnTcNtECno2z7rg2K6cgtjA"
    availability: [BUILD, RUNTIME]

  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: "expensessplit-cb870.firebaseapp.com"
    availability: [BUILD, RUNTIME]

  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: "expensessplit-cb870"
    availability: [BUILD, RUNTIME]

  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: "expensessplit-cb870.firebasestorage.app"
    availability: [BUILD, RUNTIME]

  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "1064064784793"
    availability: [BUILD, RUNTIME]

  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: "1:1064064784793:web:a8c9c829014c78cdd0db08"
    availability: [BUILD, RUNTIME]

  # Set to the backend id from `firebase apphosting:backends:list` once the
  # App Hosting backend exists. The Firebase web API key is not a secret, so
  # these values are safe to commit; App Check and Auth are what actually
  # protect the data.

  - variable: NEXT_PUBLIC_FIREBASE_APPHOSTING_BACKEND_ID
    value: ""
    availability: [BUILD, RUNTIME]

  # reCAPTCHA Enterprise site key from App Check. Required once App Check is
  # enforced; empty in the emulator, where tokens are bypassed.
  - variable: NEXT_PUBLIC_FIREBASE_APPCHECK_SITE_KEY
    value: ""
    availability: [BUILD, RUNTIME]

  # Never true in App Hosting: it would point production at localhost.
  - variable: NEXT_PUBLIC_USE_FIREBASE_EMULATORS
    value: "false"
    availability: [BUILD, RUNTIME]
